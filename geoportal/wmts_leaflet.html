<!DOCTYPE html>
<html lang="de">
<head>

	<title>WMTS in Leaflet — Stadt Zürich</title>

	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin=""></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.6.2/proj4.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.js"></script>

</head>
<body>

<div id="mapid" style="width: 1200px; height: 800px; max-width: 100%;"></div>

<script>
	/* Definiere LV95 (EPSG:2056) -- Auflösungen und Origin stammen aus den
	 * WMTS-Capabilities (TileMatrixSet "ktzh", 11 Zoomstufen, Tile-Grösse 512 Pixel).
	 * So müssen die vorgerenderten Tiles nicht reprojiziert werden.
	 */
	var lv95 = {
		epsg: 'EPSG:2056',
		def: '+proj=somerc +lat_0=46.95240555555556 +lon_0=7.439583333333333 +k_0=1 +x_0=2600000 +y_0=1200000 +ellps=bessel +towgs84=674.374,15.056,405.346,0,0,0,0 +units=m +no_defs',
		resolutions: [67.7333333333, 33.8666666667, 16.9333333333, 8.4666666667, 4.2333333333,
			2.1166666667, 1.0583333333, 0.5291666667, 0.2645833333, 0.1322916667, 0.0661458333],
		origin: [2480237.0, 1315832.0],
		bounds:  L.bounds( [2480237.000000, 1062032.000000], [2846837.000000, 1315832.000000])
	};
	var crs = new L.Proj.CRS(lv95.epsg, lv95.def, {
		resolutions: lv95.resolutions,
		origin: lv95.origin
	});
	var map = new L.Map('mapid', {
		crs: crs,
		maxZoom: crs.options.resolutions.length,
	}).setView([47.365, 8.54], 4);

	/* Verfügbare Layer stehen in den WMTS-Capabilities:
	 * https://www.ogd.stadt-zuerich.ch/mapproxy/wmts/1.0.0/WMTSCapabilities.xml
	 *
	 * Die Tile-URL folgt dem Muster
	 * .../{Layer}/default/{TileMatrixSet}/{TileMatrix}/{TileRow}/{TileCol}.png
	 * -- in Leaflet-Schreibweise also {z}/{y}/{x}.
	 * Die 1.0.0 im Pfad ist die WMTS-Protokollversion, nicht die WMS-Version 1.3.0.
	 */
	var basemaps = {
		'Basiskarte Zürich Raster Grau WMTS': L.tileLayer(
			'https://www.ogd.stadt-zuerich.ch/mapproxy/wmts/1.0.0/Basiskarte_Zuerich_Raster_Grau/default/ktzh/{z}/{y}/{x}.png', {
				maxZoom: crs.options.resolutions.length,
				tileSize: 512
			}
		),
		'Basiskarte Zürich Raster WMTS': L.tileLayer(
			'https://www.ogd.stadt-zuerich.ch/mapproxy/wmts/1.0.0/Basiskarte_Zuerich_Raster/default/ktzh/{z}/{y}/{x}.png', {
				maxZoom: crs.options.resolutions.length,
				tileSize: 512
			}
		)
	};

	L.control.layers(basemaps).addTo(map);

	basemaps['Basiskarte Zürich Raster Grau WMTS'].addTo(map);
</script>

</body>
</html>
