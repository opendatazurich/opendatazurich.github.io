<!DOCTYPE html>
<html lang="de">
<head>

	<title>WMS in Leaflet — Stadt Zürich</title>

	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin=""></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.6.2/proj4.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.js"></script>

</head>
<body>

<div id="mapid" style="width: 1200px; height: 800px; max-width: 100%;"></div>

<script>
	/* Definiere LV95 (EPSG:2056). Leaflet arbeitet standardmässig mit EPSG:3857 --
	 * die städtischen Dienste liefern aber in LV95. Mit proj4leaflet wird Leaflet
	 * um LV95 erweitert, damit der WMS die Tiles nicht reprojizieren muss.
	 */
	var lv95 = {
		epsg: 'EPSG:2056',
		def: '+proj=somerc +lat_0=46.95240555555556 +lon_0=7.439583333333333 +k_0=1 +x_0=2600000 +y_0=1200000 +ellps=bessel +towgs84=674.374,15.056,405.346,0,0,0,0 +units=m +no_defs',
		resolutions: [ 4000, 3750, 3500, 3250, 3000, 2750, 2500, 2250, 2000, 1750, 1500, 1250, 1000, 750, 650, 500, 250, 100, 50, 20, 10, 5, 2.5, 2, 1.5, 1, 0.5, 0.2, 0.1],
		origin: [2420000, 1350000]
	};
	var crs = new L.Proj.CRS(lv95.epsg, lv95.def, {
		resolutions: lv95.resolutions,
		origin: lv95.origin
	});
	var map = new L.Map('mapid', {
		crs: crs,
		maxZoom: crs.options.resolutions.length,
		minZoom: 16,
	}).setView([47.365, 8.54], 22);

	/* Der WMS-Layer heisst 'wmslayers' -- nicht wie der Dienst. Mit einem falschen
	 * Layer-Namen antwortet der Server mit HTTP 500 und die Karte bleibt leer.
	 * Gültige Layer-Namen stehen in den Capabilities:
	 * https://www.ogd.stadt-zuerich.ch/wms/geoportal/Basiskarte_Zuerich_Raster_Grau?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0
	 *
	 * Weitere Beispiele: https://leafletjs.com/examples/wms/wms.html
	 */
	var basemaps = {
		'Basiskarte Zürich Raster Grau': L.tileLayer.wms('https://www.ogd.stadt-zuerich.ch/wms/geoportal/Basiskarte_Zuerich_Raster_Grau', {
			layers: ['wmslayers'],
			version: '1.3.0',
			maxZoom: crs.options.resolutions.length,
			minZoom: 0
		}),
		'Basiskarte Zürich Raster': L.tileLayer.wms('https://www.ogd.stadt-zuerich.ch/wms/geoportal/Basiskarte_Zuerich_Raster', {
			layers: ['wmslayers'],
			version: '1.3.0',
			maxZoom: crs.options.resolutions.length,
			minZoom: 0
		})
	};

	L.control.layers(basemaps).addTo(map);

	basemaps['Basiskarte Zürich Raster Grau'].addTo(map);
</script>

</body>
</html>
