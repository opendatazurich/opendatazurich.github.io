name: Badi Besuch (ASE) — Jahres-Akkumulator

on:
  schedule:
    - cron: '6 1 * * *' # täglich um 01:06 (UTC)
  workflow_dispatch:

jobs:
  accumulate_year:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: "Set up Python"
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: Install requirements
      run: uv pip install -r automation/automation-requirements.txt
      env:
        UV_SYSTEM_PYTHON: 1

    - name: Jahres-Akkumulator erzeugen (aus CKAN)
      env:
        CKAN_BASE_URL: ${{ secrets.CKAN_BASE_URL }}
        CKAN_API_KEY: ${{ secrets.CKAN_API_KEY }}
        SSL_VERIFY: ${{ secrets.SSL_VERIFY }}
      run: python automation/badi_besuch_ase/ase_ckan_year_accumulate.py

    - name: Erzeugte Ressourcen bestimmen
      id: out
      run: |
        echo "parquet=$(ls -t automation/badi_besuch_ase/Badi_Besuch_*.parquet | head -n1)" >> "$GITHUB_OUTPUT"
        echo "csv=$(ls -t automation/badi_besuch_ase/Badi_Besuch_*.csv | head -n1)" >> "$GITHUB_OUTPUT"

    - name: Parquet in CKAN hochladen
      env:
        CKAN_BASE_URL: ${{ secrets.CKAN_BASE_URL }}
        CKAN_API_KEY: ${{ secrets.CKAN_API_KEY }}
        SSL_VERIFY: ${{ secrets.SSL_VERIFY }}
      run: python automation/upload_resource_to_ckan_with_patch.py -f ${{ steps.out.outputs.parquet }} -d ssd_spo_badi_besuch

    - name: CSV in CKAN hochladen
      env:
        CKAN_BASE_URL: ${{ secrets.CKAN_BASE_URL }}
        CKAN_API_KEY: ${{ secrets.CKAN_API_KEY }}
        SSL_VERIFY: ${{ secrets.SSL_VERIFY }}
      run: python automation/upload_resource_to_ckan_with_patch.py -f ${{ steps.out.outputs.csv }} -d ssd_spo_badi_besuch

    - name: Notify telegram failure
      if: ${{ failure() || cancelled() }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        message: |
          🔴 [Update Badi Besuch (ASE) Jahres-Akkumulator](https://github.com/opendatazurich/opendatazurich.github.io/actions/runs/${{ github.run_id }}?check_suite_focus=true)
