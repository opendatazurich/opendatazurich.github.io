name: Link Checker
# Checks URLs in Repo and CKAN Open Data Catalog, creates issues if urls do not work
# see exclude list below
# https://data.integ.stadt-zuerich.ch is excluded due to SSL problems

on:
  repository_dispatch:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 0 1 * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Link Checker for Repository
        id: lychee_repo
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept '200..=204, 429, 403, 500' --max-retries 5 --retry-wait-time 5 --suggest . --exclude 'https://data.integ.stadt-zuerich.ch/*|https://confluence-ssz.szh.loc*|https://github.com/opendatazurich/opendatazurich.github.io/settings/*' 
          fail: false

      - name: Create Issue From File
        if: steps.lychee_repo.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue

  linkCheckerCatalog:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract URLs from CKAN Catalog API
        id: extract_urls
        run: |
          python automation/link_checker/check_catalog_urls.py
          echo "url_count=$(wc -l < .cache/catalog_urls.txt)" >> "$GITHUB_OUTPUT"

      - name: Link Checker for Open Data Catalog
        id: lychee_catalog
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept '200..=204, 429, 403, 500' --max-retries 5 --retry-wait-time 5 --suggest . --max-concurrency 10 --include .cache/catalog_urls.txt
          fail: false

      - name: Enrich Report with Dataset Names
        run: python automation/link_checker/enrich_report.py

      - name: Create Issue From File
        if: steps.lychee_catalog.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report (Catalog)
          content-filepath: ./lychee/out.md
          labels: report, automated issue, catalog
